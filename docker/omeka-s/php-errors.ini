; Configuration PHP pour Omeka S — chargée automatiquement par docker-php
; car copiée dans /usr/local/etc/php/conf.d/ par le Dockerfile.
;
; - memory_limit 1024M : nécessaire pour la recherche sémantique AiLibrarian
;   qui charge tous les embeddings (~700 MB pour 85k chunks × 1024 floats).
;   À supprimer quand on migre vers une vraie base vectorielle.
; - max_execution_time 3600 : couvre les jobs longs (réindexation via HTTP,
;   génération d'une réponse IA sur un gros contexte).
; - upload / post 20M : import CSV Omeka avec fichiers volumineux (études OCR).
; - Log errors ON + fichier dédié : sans ça, les fatales PHP disparaissent
;   silencieusement (Apache renvoie 500 sans stacktrace).

log_errors = On
display_errors = On
display_startup_errors = On
error_reporting = E_ALL
error_log = /var/www/html/logs/php_errors.log

memory_limit = 4096M
max_execution_time = 3600
max_input_time = 3600

upload_max_filesize = 20M
post_max_size = 20M
